[project]
name = "sphinx-daisyui"
description = "A Sphinx documentation theme drawn with daisyUI 5 and Tailwind CSS 4, with 35 colour themes in light and dark"
license = "MIT"
version = "0.2.0"
readme = "README.md"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "sphinx",
    "sphinx-theme",
    "theme",
    "daisyui",
    "tailwind",
    "tailwindcss",
    "documentation",
    "docs",
    "dark-mode",
    "furo",
    "pydata-sphinx-theme",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Theme",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Software Development :: Documentation",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "docutils>=0.20",
    "markupsafe>=2.1",
    "pygments>=2.17",
    "sphinx>=7.4",
    "sphinxcontrib-serializinghtml>=1.1.9",
]

[project.entry-points."sphinx.html_themes"]
daisyui = "sphinx_daisyui"

[project.urls]
Homepage = "https://samueljennings.github.io/sphinx-daisyui/"
Documentation = "https://samueljennings.github.io/sphinx-daisyui/"
Repository = "https://github.com/SamuelJennings/sphinx-daisyui"
Issues = "https://github.com/SamuelJennings/sphinx-daisyui/issues"
Changelog = "https://github.com/SamuelJennings/sphinx-daisyui/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pydoclint>=0.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "types-docutils>=0.20",
    "types-pygments>=2.17",
]
docs = [
    "myst-parser>=4.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.8.0",
]

[build-system]
requires = ["hatchling", "hatch-jupyter-builder>=0.10"]
build-backend = "hatchling.build"

# The stylesheets (the theme's, and the page-body styles on their own) are compiled
# from assets/ with npm when the package is built, and ship in both the wheel and the
# sdist, so installing the theme never needs Node. A build that finds them already
# compiled leaves them alone.
[tool.hatch.build.hooks.jupyter-builder]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "src/sphinx_daisyui/theme/daisyui/static/styles/sphinx-daisyui.css",
    "src/sphinx_daisyui/theme/daisyui/static/styles/sphinx-daisyui-content.css",
]
skip-if-exists = [
    "src/sphinx_daisyui/theme/daisyui/static/styles/sphinx-daisyui.css",
    "src/sphinx_daisyui/theme/daisyui/static/styles/sphinx-daisyui-content.css",
]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build"
npm = ["npm"]

[tool.hatch.build]
artifacts = [
    "src/sphinx_daisyui/theme/daisyui/static/styles/sphinx-daisyui.css",
    "src/sphinx_daisyui/theme/daisyui/static/styles/sphinx-daisyui-content.css",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sphinx_daisyui"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/sphinx_daisyui",
    "/assets",
    "/package.json",
    "/package-lock.json",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.forge.conformance]
non-mirror-paths = ["tests/test_templates/", "tests/test_docs/"]

[tool.coverage.run]
branch = true
source = ["sphinx_daisyui"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.extend-per-file-ignores]
# Asserts are how pytest tests assert.
"tests/**" = ["S101"]
# A test site's conf.py sets Sphinx's `copyright` option, which shadows a builtin.
"tests/roots/**" = ["A001"]

[tool.mypy]
files = ["src/sphinx_daisyui"]
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.deptry]
extend_exclude = ["tests/", "docs/"]
