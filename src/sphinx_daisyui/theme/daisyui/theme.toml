[theme]
inherit = "basic"
stylesheets = ["styles/sphinx-daisyui.css"]
sidebars = ["sidebar-nav.html"]
pygments_style = { default = "default" }

[options]
# daisyUI's own: the theme for each mode, the starting mode, and the optional picker.
layout = "hHh LpR lff"
light_theme = "light"
dark_theme = "dark"
default_mode = "auto"
theme_picker = ""

# Shared by Furo and pydata-sphinx-theme.
announcement = ""
navigation_with_keys = ""

# Furo's options.
light_logo = ""
dark_logo = ""
sidebar_hide_name = ""
light_css_variables = ""
dark_css_variables = ""
footer_icons = ""
top_of_page_button = "edit"
top_of_page_buttons = ""
source_repository = ""
source_branch = ""
source_directory = ""
source_edit_link = ""
source_view_link = ""

# pydata-sphinx-theme's options.
sidebar_includehidden = "true"
use_edit_page_button = ""
external_links = ""
bitbucket_url = ""
github_url = ""
gitlab_url = ""
twitter_url = ""
icon_links_label = "Icon links"
icon_links = ""
analytics = ""
show_prev_next = "true"
search_bar_text = "Search the docs"
collapse_navigation = ""
navigation_depth = "4"
show_nav_level = "1"
show_toc_level = "2"
navbar_align = "content"
header_links_before_dropdown = "5"
header_dropdown_text = "More"
switcher = ""
check_switcher = "true"
pygments_light_style = ""
pygments_dark_style = ""
logo = ""
logo_link = ""
surface_warnings = "true"
back_to_top_button = "true"
disable_search = ""
search_as_you_type = "true"
shorten_urls = "true"
navbar_start = "navbar-logo"
navbar_center = ""
navbar_end = "version-switcher, theme-switcher, navbar-icon-links"
navbar_persistent = "search-button-field"
article_header_start = "breadcrumbs"
article_header_end = ""
article_footer_items = ""
content_footer_items = ""
primary_sidebar_end = ""
footer_start = "copyright, sphinx-version"
footer_center = ""
footer_end = "theme-version"
secondary_sidebar_items = "page-toc"
show_version_warning_banner = ""
sticky_banners = ""
templates_skip_empty_check = ""
pygment_light_style = ""
pygment_dark_style = ""
