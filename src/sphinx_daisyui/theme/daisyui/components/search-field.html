{%- if not theme_disable_search %}
<button type="button" class="daisy-search-open btn btn-sm h-9 gap-2 border-base-300 bg-base-200/70 font-normal text-base-content/70 shadow-none hover:bg-base-200 md:w-56 md:justify-start" aria-label="Search" aria-haspopup="dialog">
  {{ daisy.icon("search", "size-4") }}
  <span class="hidden md:inline">{{ daisy.search_bar_text }}</span>
  <span class="ms-auto hidden items-center gap-0.5 md:flex"><kbd class="kbd kbd-xs" data-daisy-mod>Ctrl</kbd><kbd class="kbd kbd-xs">K</kbd></span>
</button>
{%- endif %}
