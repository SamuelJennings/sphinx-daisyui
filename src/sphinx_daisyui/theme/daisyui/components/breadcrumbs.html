{%- if parents or pagename != root_doc %}
<nav class="breadcrumbs py-0 text-sm text-base-content/70" aria-label="Breadcrumb">
  <ul>
    <li><a href="{{ pathto(root_doc) }}" aria-label="Home">{{ daisy.icon("book-open", "size-4") }}</a></li>
    {%- for parent in parents %}<li><a href="{{ parent.link|e }}">{{ parent.title }}</a></li>{% endfor %}
    {%- if pagename != root_doc %}<li class="truncate" aria-current="page"><span class="truncate">{{ title|striptags|e }}</span></li>{% endif %}
  </ul>
</nav>
{%- endif %}
