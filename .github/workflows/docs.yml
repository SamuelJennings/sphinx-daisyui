name: Deploy Docs

# Builds the documentation with the theme and publishes it to GitHub Pages.
# Written here rather than called from a shared workflow because installing the
# package compiles its stylesheet with npm, which the runner provides.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: docs

      - name: Sync dependencies
        run: uv sync --locked --group docs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # -W turns warnings into errors. --keep-going reports every warning first.
      - name: Build
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time. A newer push replaces a deploy still waiting.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
