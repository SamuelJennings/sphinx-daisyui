name: Tests

# Runs the suite against every supported Sphinx minor version, and builds the
# documentation with the theme. The jobs are written here rather than called from
# a shared workflow because the shared one tests against Django versions, and this
# package does not use Django.
#
# Installing the package compiles its stylesheet with npm, which the runner
# provides.

on:
  push:
    branches:
      - main
  # No paths filter: these checks are required, and a path-filtered required
  # check never reports on a pull request outside its paths, which blocks merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}, Sphinx ${{ matrix.sphinx-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # One leg for each supported Sphinx minor, each on a Python it supports.
        include:
          - python-version: "3.11"
            sphinx-version: "7.4"
          - python-version: "3.11"
            sphinx-version: "8.2"
          - python-version: "3.12"
            sphinx-version: "9.0"
          - python-version: "3.13"
            sphinx-version: "9.1"
          - python-version: "3.14"
            sphinx-version: "9.2"
    env:
      # `uv run` normally re-syncs the environment to uv.lock before every
      # command, which would undo the Sphinx version installed for this leg.
      UV_NO_SYNC: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: sphinx-${{ matrix.sphinx-version }}

      # --locked fails the job when uv.lock is out of date with pyproject.toml.
      - name: Sync dependencies
        run: uv sync --locked

      - name: Pin Sphinx version
        env:
          SPHINX_VERSION: ${{ matrix.sphinx-version }}
        run: |
          uv pip install "sphinx~=${SPHINX_VERSION}.0"
          # Fail rather than report a leg that never ran on its Sphinx.
          uv run python -c "import os, sys, sphinx; want = os.environ['SPHINX_VERSION']; got = '.'.join(map(str, sphinx.version_info[:2])); print(f'Sphinx {sphinx.__version__}'); sys.exit(0 if got == want else f'expected Sphinx {want}, got {got}')"

      - name: Run tests
        run: uv run pytest --cov=sphinx_daisyui --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14' && matrix.sphinx-version == '9.2'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: docs

      - name: Sync dependencies
        run: uv sync --locked --group docs

      # -W turns warnings into errors. --keep-going reports every warning first.
      - name: Build
        run: uv run sphinx-build -b html -W --keep-going docs "$RUNNER_TEMP/docs"
